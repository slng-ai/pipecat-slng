name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The v0.5.1 release shipped with pyproject at 0.6.0 — the tag and the
      # package version had drifted. Fail loudly here instead of publishing
      # a wheel whose version nobody expects.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != pyproject $pkg"; exit 1; }

      - run: uv build

      # --check-url makes a re-run of a failed release idempotent rather than
      # erroring on files PyPI already has.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
